<div class="container">
  <div>
    <h2>Modifier un Book :</h2>
  </div>
  <form>
    <div hidden class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Book</label>
      <input type="text" [(ngModel)]="currentBook.idBook"
             name="idBook" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Book</label>
      <input type="text" [(ngModel)]="currentBook.nomBook"
             name="nomBook" class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix Book</label>
      <input type="number" [(ngModel)]="currentBook.prixBook"
             name="prixBook" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date creation</label>
      <input type="date" [ngModel]="currentBook.dateCreation | date: 'yyyy-MM-dd'"
             (ngModelChange)="currentBook.dateCreation = $event" name="dateCreation"
             class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Type</label>
      <select class="form-control form-control-lg" id="idType" name="idType"
              [(ngModel)]="updatedTypeId">
        @for(type of types; track type.idType)
        {
          <option [value]="type.idType">{{type.nomType}}</option>
        }
      </select>
    </div>

    <div class="mt-2">
      <button type="submit" (click)="updateBook()" class="btn btn-success">Modifier</button>
    </div>
  </form>
</div>
