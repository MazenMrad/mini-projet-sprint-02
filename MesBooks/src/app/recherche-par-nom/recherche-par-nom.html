<div class="container">
  <form class="form-inline">
    <div class="form-group mx-sm-3 mb-2 mt-2">
      <label>Nom Book</label>
      <input type="text" class="form-control" [(ngModel)]="nomBook" name="nomBook" class="form-control">
      <button type="submit" (click)="rechercherBooks()" class="btn btn-primary mb-2 ml-2">Rechercher</button>
    </div>
  </form>
  <form class="form-inline">
    <div class="form-group mx-sm-3 mb-2 mt-2">
      <label>Nom Book en tapant</label>
      <input class="form-control" #searchInput (keyup)="onKeyUp(searchInput.value)">
    </div>
  </form>
  <form class="form-inline">
    <div class="form-group mx-sm-3 mb-2 mt-2">
      <label>Nom Book en tapant</label>
      <input #nom [(ngModel)]="searchTerm" name="searchTerm" class="form-control">
    </div>
  </form>
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <tr>
          <th>Id</th>
          <th>Nom</th>
          <th>Prix</th>
          <th>Date Creation</th>
          <th>Type</th>
        </tr>
        @for (book of books | searchFilter: searchTerm; track book.idBook)
        {
          <tbody>
            <tr>
              <td>{{book.idBook}}</td>
              <td>{{book.nomBook}}</td>
              <td>{{book.prixBook}}</td>
              <td>{{book.dateCreation | date:'dd/MM/yyyy'}}</td>
              @if(book.type){
                <td>{{book.type.nomType}}</td> }
              @else {
                <td>PAS DE TYPE</td>
              }
              <!--
              <td><a class="btn btn-danger" (click)="supprimerBook(book)">Supprimer</a></td>
              <td><a class="btn btn-success" [routerLink]="['/updateBook', book.idBook]">Modifier</a></td> -->
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
